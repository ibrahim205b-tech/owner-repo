<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مطعم الحجي - المنيو</title>
  <meta name="description" content="منيو مطعم الحجي وطلب الأكل أونلاين">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="brand">مطعم الحجي<small>المنيو</small></h1>
      <button class="cart-btn" id="open-cart" type="button" aria-controls="cart-drawer">
        السلة <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <nav class="cats" aria-label="أقسام المنيو" id="cats" hidden>
    <ul id="cat-list"></ul>
  </nav>

  <main id="main">
    <p class="status" id="status">جارٍ تحميل المنيو...</p>
    <div id="notice-area"></div>
    <div id="menu"></div>
  </main>

  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cart-title" hidden>
    <header>
      <h2 id="cart-title">سلة المشتريات</h2>
      <button class="close-x" id="close-cart" type="button" aria-label="إغلاق">×</button>
    </header>
    <div class="body" id="cart-body"></div>
    <footer id="cart-footer"></footer>
  </aside>

  <!-- Libraries and data. Order matters. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/menu-data.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
