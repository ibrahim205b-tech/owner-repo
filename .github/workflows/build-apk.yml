name: Build staff APK

# Builds the restaurant staff app as an APK in the cloud.
# Download it from the run's "Artifacts" section (Actions tab > this workflow > latest run).
on:
  push:
    branches: [main]
    paths:
      - "android-staff/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-staff
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu image already includes the Android SDK (ANDROID_HOME) and sdkmanager.
      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hajji-staff-apk
          path: android-staff/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
