name: Build staff APK

# Builds the restaurant staff app as an APK in the cloud.
# Download it from the run's "Artifacts" section (Actions tab > this workflow > latest run).
on:
  push:
    branches: [main]
    paths:
      - "android-staff/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-staff
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu image already includes the Android SDK. Locate it explicitly,
      # accept the standard licenses by writing the license files, and retry the download.
      - name: Install Android platform and build tools
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK at: $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          mkdir -p "$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0"; then
              exit 0
            fi
            echo "sdkmanager attempt $attempt failed, retrying..."
            sleep 10
          done
          exit 1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hajji-staff-apk
          path: android-staff/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
